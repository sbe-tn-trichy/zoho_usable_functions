[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoho-usable-functions"
version = "0.1.0"
description = "High-level helper functions and automations on top of Zoho SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zoho-sdk[workflows]>=0.2,<0.3",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
